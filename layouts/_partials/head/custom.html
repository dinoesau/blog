<link rel="icon" type="image/png" sizes="32x32" href="{{ "img/favicon.png" | relURL }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ "img/favicon-180.png" | relURL }}">

<style>
    /* Merriweather loaded via custom-font.html */
    :root {
        --article-font-family: "Merriweather", var(--base-font-family);
    }
</style>

{{- with site.Params.analytics.cloudflare.token -}}
<script>
    (function () {
        var token = {{ . }};
        var loaded = false;

        function loadBeacon() {
            if (loaded) return;
            loaded = true;

            var script = document.createElement('script');
            script.async = true;
            script.src = 'https://static.cloudflareinsights.com/beacon.min.js';
            script.setAttribute('data-cf-beacon', JSON.stringify({ token: token }));
            document.head.appendChild(script);
        }

        function init() {
            if (document.documentElement.dataset.consentAnalytics === 'true') {
                loadBeacon();
            }
        }

        window.addEventListener('onCookieConsentChange', function (e) {
            if (e.detail && e.detail.analytics) {
                loadBeacon();
            }
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>
{{- end -}}
