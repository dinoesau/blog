# Change baseurl before deploy
baseurl = "https://esau.com.mx/"

# Interpret front matter dates in this zone regardless of the build machine's TZ.
timeZone = "America/Mexico_City"

# Populate .Lastmod from git history so "last updated" dates stay accurate.
enableGitInfo = true

# Language title, languageCode and params are defined per-language in languages.toml
# English (default) is served from the root, Spanish from /es/
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage = false

# Change it to your Disqus shortname before using
disqusShortname = "esau-blog"

[taxonomies]
    category = "categories"
    tag      = "tags"
    series   = "series"

[pagination]
    pagerSize = 5

# Defaults used for pages that do not set their own sitemap front matter.
[sitemap]
    changefreq = "monthly"
    priority   = 0.5
