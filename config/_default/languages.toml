[en]
    languageName      = "English"
    languagedirection = "ltr"
    languageCode      = "en-us"
    title             = "Esau Martinez's Blog"
    weight            = 1
    contentDir        = "content/en"

    [[en.menus.main]]
        identifier = "home"
        name       = "Home"
        pageRef    = "/"
        weight     = 1

        [en.menus.main.params]
            icon = "home"

    [[en.menus.main]]
        identifier = "archives"
        name       = "Archives"
        pageRef    = "/page/archives"
        weight     = 2

        [en.menus.main.params]
            icon = "archives"

    [[en.menus.main]]
        identifier = "search"
        name       = "Search"
        pageRef    = "/page/search"
        weight     = 3

        [en.menus.main.params]
            icon = "search"

    [[en.menus.main]]
        identifier = "links"
        name       = "Links"
        pageRef    = "/page/links"
        weight     = 4

        [en.menus.main.params]
            icon = "link"

    [[en.menus.social]]
        identifier = "github"
        name       = "GitHub"
        url        = "https://github.com/dinoesau"

        [en.menus.social.params]
            icon = "brand-github"

    [[en.menus.social]]
        identifier = "linkedin"
        name       = "LinkedIn"
        url        = "https://www.linkedin.com/in/esaum/"

        [en.menus.social.params]
            icon = "brand-linkedin"

    [[en.menus.social]]
        identifier = "email"
        name       = "Email"
        url        = "mailto:contact@esau.com.mx"

        [en.menus.social.params]
            icon = "mail"

[es]
    languageName      = "Español"
    languagedirection = "ltr"
    languageCode      = "es-mx"
    title             = "Blog de Esau Martinez"
    weight            = 2
    contentDir        = "content/es"

    [es.params]
        description = "Blog personal sobre arquitectura de software, TypeScript, Python y desarrollo asistido por IA, escrito en inglés y español."

    [es.params.sidebar]
        subtitle = "Notas sobre computación, matemáticas y literatura, intercaladas con jardinería, fotografía y el arte de aprender."

    [[es.menus.main]]
        identifier = "home"
        name       = "Inicio"
        pageRef    = "/"
        weight     = 1

        [es.menus.main.params]
            icon = "home"

