[en]
    languageName      = "English"
    languagedirection = "ltr"
    languageCode      = "en-us"
    title             = "Esau Martinez's Blog"
    weight            = 1
    contentDir        = "content/en"

    [[en.menus.main]]
        identifier = "home"
        name       = "Home"
        pageRef    = "/"
        weight     = 1

        [en.menus.main.params]
            icon = "home"

    [[en.menus.main]]
        identifier = "archives"
        name       = "Archives"
        pageRef    = "/page/archives"
        weight     = 2

        [en.menus.main.params]
            icon = "archives"

    [[en.menus.main]]
        identifier = "search"
        name       = "Search"
        pageRef    = "/page/search"
        weight     = 3

        [en.menus.main.params]
            icon = "search"

    [[en.menus.main]]
        identifier = "links"
        name       = "Links"
        pageRef    = "/page/links"
        weight     = 4

        [en.menus.main.params]
            icon = "link"

